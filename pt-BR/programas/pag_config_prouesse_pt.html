<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Meta tags obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#173a39">
    <script>
      /* Define o tema ANTES da primeira pintura (evita "piscar" claro): usa a escolha salva ou a do sistema */
      (function () {
        var tema = "light";
        try { tema = localStorage.getItem("prouesse_tema") || ""; } catch (e) {}
        if (tema !== "light" && tema !== "dark")
          tema = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.setAttribute("data-bs-theme", tema);
      })();
    </script>

    <!-- Dependências: jQuery 3.7.1 e Bootstrap 5.3.3 (o bundle já inclui o Popper) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <style>
/* =====================================================================
   TEMA DO PROUESSE (sobre Bootstrap 5)
   Toda cor, raio e sombra vem das variáveis abaixo: para mudar a
   identidade visual, altere somente este bloco.
   ===================================================================== */
:root {
  color-scheme: light;   /* controles nativos (setas do campo numérico, rolagem) seguem o tema da página, não o do sistema */
  --marca:        #1f6f6b;   /* teal principal */
  --marca-escura: #153f3e;   /* cabeçalhos de tabela, navegação */
  --marca-media:  #2b8a85;
  --marca-clara:  #e3f0ee;   /* fundos suaves, hover */
  --marca-link:   #1f6f6b;   /* links e textos de destaque */
  --titulo:       #153f3e;   /* títulos e textos em destaque */
  --destaque:     #7fd8cc;   /* aba ativa na barra escura */
  --fundo:        #eef3f3;
  --superficie:   #ffffff;
  --texto:        #1c2b2b;
  --texto-suave:  #5a6e6e;
  --borda:        #d3e0df;
  --perigo:       #c0392b;
  --perigo-claro: #fdeceb;
  --sucesso:      #17803d;
  --sucesso-claro:#e6f5ec;
  --sucesso-texto:#17803d;
  --texto-erro:   #7d1f16;   /* texto sobre fundo de erro */
  --sup-alt:      #f6faf9;   /* painéis internos, rodapé de modal */
  --hover:        #f3f9f8;   /* linha de tabela sob o mouse */
  --linha:        #e4eded;   /* divisórias de tabela */
  --zebra:        #f7fbfa;
  --col-primeira: #f0f6f5;
  --cabecalho-2:  #1d514f;   /* 2ª linha do cabeçalho de tabela */
  --pilula-borda: #c4dcd9;
  --pilula-hover: #d3e8e5;
  --campo-desab:  #f0f4f4;
  --placeholder:  #8da0a0;
  --check-borda:  #7f9a99;
  --cartao-sombra:rgba(8, 30, 29, .35);
  --raio:         12px;
  --raio-pequeno: 8px;
  --sombra:       0 1px 2px rgba(21, 63, 62, .06), 0 4px 16px rgba(21, 63, 62, .08);
  --altura-nav:   56px;      /* barra principal */
  --altura-subnav:48px;      /* barra de abas de "Gerar configuração" */

  /* Faz o Bootstrap usar a cor da marca (links, foco, checks, abas...) */
  --bs-primary: var(--marca);
  --bs-primary-rgb: 31, 111, 107;
  --bs-link-color: var(--marca-link);
  --bs-link-color-rgb: 31, 111, 107;
  --bs-link-hover-color: var(--titulo);
  --bs-link-hover-color-rgb: 21, 63, 62;
  --bs-body-color: var(--texto);
  --bs-body-bg: var(--superficie);
  --bs-border-color: var(--borda);
  --bs-focus-ring-color: rgba(31, 111, 107, .25);
}

/* ---------- Tema escuro (data-bs-theme="dark" no <html>; botão na barra superior) ---------- */
:root[data-bs-theme="dark"] {
  --marca:        #26807a;
  --marca-escura: #1c5651;
  --marca-media:  #3aa39b;
  --marca-clara:  #1f3433;
  --marca-link:   #6cd0c6;
  --titulo:       #a5e3da;
  --destaque:     #7fd8cc;
  --fundo:        #0e1616;
  --superficie:   #172222;
  --texto:        #e2edec;
  --texto-suave:  #9db3b1;
  --borda:        #2c3f3e;
  --perigo:       #d1493d;
  --perigo-claro: #3a1f1c;
  --sucesso:      #1f8f4d;
  --sucesso-claro:#14301f;
  --sucesso-texto:#6fe09a;
  --texto-erro:   #ffb4ab;
  --sup-alt:      #1b2a2a;
  --hover:        #1d2e2d;
  --linha:        #263838;
  --zebra:        #1a2727;
  --col-primeira: #1d2d2d;
  --cabecalho-2:  #226660;
  --pilula-borda: #2f4a48;
  --pilula-hover: #28403e;
  --campo-desab:  #202e2e;
  --placeholder:  #6f8886;
  --check-borda:  #6f8a89;
  --sombra:       0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .35);
  --cartao-sombra:rgba(0, 0, 0, .6);
  --bs-primary-rgb: 38, 128, 122;
  --bs-link-color-rgb: 108, 208, 198;
  --bs-link-hover-color-rgb: 165, 227, 218;
  --bs-focus-ring-color: rgba(108, 208, 198, .3);
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
body {
  background: var(--fundo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.desabilitado { display: none; }
footer { text-align: center; }

/* ---------- Botões ---------- */
.btn {
  --bs-btn-border-radius: var(--raio-pequeno);
  --bs-btn-font-weight: 500;
  --bs-btn-padding-x: 1.1rem;
  --bs-btn-padding-y: .5rem;
  transition: background-color .15s, border-color .15s, box-shadow .15s, transform .05s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  --bs-btn-bg: var(--marca);            --bs-btn-border-color: var(--marca);
  --bs-btn-hover-bg: var(--marca-escura);--bs-btn-hover-border-color: var(--marca-escura);
  --bs-btn-active-bg: var(--marca-escura);--bs-btn-active-border-color: var(--marca-escura);
  --bs-btn-disabled-bg: var(--marca);   --bs-btn-disabled-border-color: var(--marca);
}
.btn-success {
  --bs-btn-bg: var(--sucesso);          --bs-btn-border-color: var(--sucesso);
  --bs-btn-hover-bg: #12662f;           --bs-btn-hover-border-color: #12662f;
  --bs-btn-active-bg: #12662f;          --bs-btn-active-border-color: #12662f;
}
.btn-danger {
  --bs-btn-bg: var(--perigo);           --bs-btn-border-color: var(--perigo);
  --bs-btn-hover-bg: #a22f23;           --bs-btn-hover-border-color: #a22f23;
  --bs-btn-active-bg: #a22f23;          --bs-btn-active-border-color: #a22f23;
}
.btn-info {
  --bs-btn-color: #fff;                 --bs-btn-hover-color: #fff;
  --bs-btn-bg: var(--marca-media);      --bs-btn-border-color: var(--marca-media);
  --bs-btn-hover-bg: var(--marca);      --bs-btn-hover-border-color: var(--marca);
}

/* Botão "X" de excluir linha: discreto, só ganha cor ao passar o mouse */
.b-excluir {
  width: 36px; height: 36px; padding: 0; line-height: 1;
  --bs-btn-color: var(--texto-erro);
  --bs-btn-bg: var(--perigo-claro);       --bs-btn-border-color: transparent;
  --bs-btn-hover-color: #fff;
  --bs-btn-hover-bg: var(--perigo);       --bs-btn-hover-border-color: var(--perigo);
  --bs-btn-active-color: #fff;
}

/* ---------- Campos de formulário ---------- */
.form-control, .form-select {
  border-color: var(--borda);
  border-radius: var(--raio-pequeno);
}
.form-control:focus, .form-select:focus {
  border-color: var(--marca-media);
  box-shadow: 0 0 0 .2rem rgba(31, 111, 107, .18);
}
.form-control::placeholder { color: var(--placeholder); }
input[type="radio"], input[type="checkbox"] { accent-color: var(--marca); }
.form-check-input { border-color: var(--check-borda); }
.form-check-input:checked { background-color: var(--marca); border-color: var(--marca); }
.form-check-input:focus { border-color: var(--marca-media); box-shadow: 0 0 0 .2rem rgba(31, 111, 107, .18); }
.form-group { margin-bottom: 1.1rem; }
label { cursor: pointer; }
input[type="number"] { text-align: center; }

/* ---------- Barra principal (Apresentação, Como utilizar, ...) ---------- */
body > nav {
  position: sticky; top: 0; z-index: 1030;
}
.nav-principal {
  min-height: var(--altura-nav);
  padding: 0 1rem;
  gap: .25rem;
  align-items: stretch;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  background: linear-gradient(135deg, #0d2827 0%, #153f3e 55%, #1b5654 100%);
  border-bottom: 0;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
}
.nav-principal::-webkit-scrollbar { display: none; }
.nav-principal::before {
  content: "Prouesse";
  align-self: center;
  margin-right: 1.25rem;
  padding-right: 1.25rem;
  border-right: 1px solid rgba(255, 255, 255, .18);
  color: #fff;
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: .02em;
}
.nav-principal .nav-link {
  display: flex; align-items: center;
  color: rgba(255, 255, 255, .72);
  font-weight: 500;
  white-space: nowrap;
  border: 0;
  border-bottom: 3px solid transparent;
  border-radius: 0;
  padding: 0 1rem;
  margin: 0;
}
.nav-principal .nav-link:hover,
.nav-principal .nav-link:focus-visible { color: #fff; background: rgba(255, 255, 255, .06); }
.nav-principal .nav-link.active {
  color: #fff;
  background: rgba(255, 255, 255, .08);
  border-bottom-color: var(--destaque);
}

/* Botão claro/escuro (extremo direito da barra principal) */
.btn-tema {
  position: sticky; right: 0;
  margin-left: auto; align-self: center; flex: 0 0 auto;
  width: 38px; height: 38px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; background: #1a4a48;
  border: 1px solid rgba(255, 255, 255, .25); border-radius: 50%;
  cursor: pointer;
  transition: background-color .15s, transform .15s, border-color .15s;
}
.btn-tema:hover { background: #24625f; border-color: rgba(255, 255, 255, .5); }
.btn-tema:active { transform: scale(.94); }
.btn-tema:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
.btn-tema svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-tema .icone-sol { display: none; }
[data-bs-theme="dark"] .btn-tema .icone-sol { display: block; }
[data-bs-theme="dark"] .btn-tema .icone-lua { display: none; }

/* ---------- Abas internas ("Gerar configuração") ---------- */
#nav-gerar > div > nav {
  position: sticky; top: var(--altura-nav); z-index: 1020;
}
.menu-background {
  background: var(--superficie);
  border-bottom: 1px solid var(--borda);
  padding: 0 1rem;
  gap: .15rem;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: thin;
}
.menu-background .nav-link {
  display: flex; align-items: center;
  min-height: var(--altura-subnav);
  white-space: nowrap;
  color: var(--texto-suave);
  font-weight: 500;
  font-size: .95rem;
  border: 0;
  border-bottom: 3px solid transparent;
  border-radius: 0;
  margin: 0;
  padding: 0 .9rem;
}
.menu-background .nav-link:hover { color: var(--marca-link); background: var(--marca-clara); }
.menu-background .nav-link.active {
  color: var(--titulo);
  background: transparent;
  border-bottom-color: var(--marca);
  font-weight: 600;
}

/* Terceiro nível (abas de resultados): botões em forma de pílula */
#aba6 .menu-background {
  position: static;
  background: transparent;
  border-bottom: 0;
  padding: 1rem 1.5rem .25rem;
  gap: .5rem;
  overflow-x: auto;
}
#aba6 .menu-background .nav-link {
  min-height: 0;
  padding: .45rem 1rem;
  border: 1px solid var(--borda);
  border-radius: 999px;
  background: var(--superficie);
  color: var(--texto-suave);
}
#aba6 .menu-background .nav-link:hover { background: var(--marca-clara); color: var(--marca-link); }
#aba6 .menu-background .nav-link.active {
  background: var(--marca); border-color: var(--marca); color: #fff;
}

/* ---------- Cartões de conteúdo (Apresentação, Como utilizar, Sobre, Início) ---------- */
.conteudo {
  background: var(--superficie);
  max-width: 980px;
  margin: 1.75rem auto;
  padding: 2rem clamp(1.1rem, 4vw, 2.75rem) 2.25rem;
  border-radius: calc(var(--raio) + 4px);
  box-shadow: var(--sombra);
  text-align: left;
}
.conteudo h1 {
  font-size: clamp(1.6rem, 3.2vw, 2.1rem);
  font-weight: 700;
  color: var(--titulo);
  margin-bottom: 1.25rem;
}
.conteudo h1.text-center { margin-bottom: 1.75rem; }
.conteudo h1.text-center::after {
  content: ""; display: block; width: 56px; height: 4px; margin: .7rem auto 0;
  border-radius: 4px; background: linear-gradient(90deg, var(--marca), var(--destaque));
}
.conteudo h4 {
  font-size: 1.05rem;
  font-weight: 400;
  line-height: 1.7;
  color: var(--texto);
}
.conteudo h4 p { margin-bottom: 1rem; }
.conteudo h4 ul { padding-left: 0; list-style: none; margin: .5rem 0 1.25rem; }
.conteudo h4 ul li {
  position: relative; padding: .35rem 0 .35rem 1.8rem;
}
.conteudo h4 ul li::before {
  content: ""; position: absolute; left: .3rem; top: .95em;
  width: .6rem; height: .6rem; border-radius: 50%; background: var(--marca-media);
}
.conteudo a { text-underline-offset: 3px; }
.conteudo hr { border-color: var(--borda); opacity: 1; margin: 1.25rem 0; }

#aba0 .conteudo > div:first-child > div:first-child { font-weight: 600; font-size: 1.15rem; margin-bottom: .9rem; }
#aba0 .conteudo .btn { margin: 0 .35rem .5rem 0; padding: .6rem 1.25rem; }
.externo label { font-weight: 500; margin-bottom: .5rem; }
.externo .form-control { max-width: 520px; }

/* ---------- Painel "Gerar configuração" ---------- */
.geracao_dados { background: var(--fundo); min-height: calc(100vh - var(--altura-nav)); }
#aba1, #aba2, #aba3, #aba4 { padding: 1.25rem 1.5rem 2rem; }
#aba5, #aba7 { padding: 1.5rem; }
#aba6 { padding-bottom: 1.5rem; }
.geracao_dados > div > .tab-content > .tab-pane { min-height: 50vh; }
#aba3.tab-pane:empty, #aba4.tab-pane:empty { min-height: 0; }

/* Mensagens "É necessário inserir dados na aba ..." (aba3 e aba4 antes do preenchimento) */
#aba3:not(:has(table)), #aba4:not(:has(table)) {
  max-width: 720px; margin: 1.5rem auto; padding: 1.25rem 1.5rem;
  background: var(--superficie); border-radius: var(--raio); box-shadow: var(--sombra);
  border-left: 4px solid var(--marca-media); text-align: left !important;
  color: var(--texto-suave); min-height: 0 !important;
}

/* ---------- Tabelas de entrada de dados ---------- */
.tabela-prouesse {
  --bs-table-bg: var(--superficie);
  --bs-table-color: var(--texto);
  --bs-table-hover-bg: var(--hover);
  --bs-table-hover-color: var(--texto);
  --bs-table-border-color: var(--linha);
  margin-bottom: 1rem;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--superficie);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
}
.tabela-prouesse > :not(caption) > * > * { padding: .6rem .75rem; border-bottom-width: 1px; }
.tabela-prouesse thead th {
  background: var(--marca-escura);
  color: #fff;
  font-weight: 600;
  font-size: .9rem;
  border-bottom: 0;
  vertical-align: middle;
  text-align: center;
}
.tabela-prouesse thead tr:nth-child(2) th { background: var(--cabecalho-2); font-weight: 500; }
.tabela-prouesse thead tr:first-child th:first-child { border-top-left-radius: var(--raio); }
.tabela-prouesse thead tr:first-child th:last-child  { border-top-right-radius: var(--raio); }
.tabela-prouesse tbody tr:last-child td:first-child { border-bottom-left-radius: var(--raio); }
.tabela-prouesse tbody tr:last-child td:last-child  { border-bottom-right-radius: var(--raio); }
.tabela-prouesse tbody tr:last-child td { border-bottom: 0; }
.tabela-prouesse tbody td { vertical-align: middle; }
.tabela-prouesse td.ordem, .tabela-prouesse th.numeracao {
  width: 3.2rem; text-align: center; color: var(--texto-suave); font-weight: 600;
}
.tabela-prouesse thead th.numeracao { color: #fff; }
.tabela-prouesse td.professor { font-weight: 600; text-align: center; }
.tabela-prouesse tbody td:first-child:not(.ordem) { border-left: 0; }
thead.sticky-top { top: calc(var(--altura-nav) + var(--altura-subnav)); }

/* Ícones de ajuda (i) dentro das tabelas */
.aula_geminada_info, .n_max_flex_info { cursor: pointer; vertical-align: -.125em; opacity: .85; transition: opacity .15s, transform .15s; }
svg.aula_geminada_info:hover, .n_max_flex_info:hover { opacity: 1; transform: scale(1.15); }
.n_max_flex_info { color: var(--marca-media); }

/* Aba "Dados iniciais": larguras */
#aba1 .input_turmas td.b-excluir, #aba1 td:last-child { width: 3.4rem; text-align: center; }
#aba1 .tabela-num-aulas td:last-child { width: auto; }

/* Aba "Professores e turmas" (detalhes recolhíveis) */
._details { margin: 0; width: 100%; }
._details > summary {
  display: inline-flex; align-items: center; gap: .4rem;
  cursor: pointer; user-select: none;
  padding: .35rem .85rem;
  font-size: .9rem; font-weight: 500; color: var(--titulo);
  background: var(--marca-clara);
  border: 1px solid var(--pilula-borda);
  border-radius: 999px;
  list-style: none;
  transition: background-color .15s;
}
._details > summary::-webkit-details-marker { display: none; }
._details > summary::before {
  content: ""; width: .45rem; height: .45rem;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(-45deg); transition: transform .2s;
}
._details[open] > summary::before { transform: rotate(45deg); }
._details > summary:hover { background: var(--pilula-hover); }
._details > summary:focus-visible { outline: 3px solid rgba(31, 111, 107, .35); outline-offset: 2px; }

details[open] summary ~ * { animation: abertura .25s ease-out; }
@keyframes abertura {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}

.detalhes {
  margin-top: .6rem;
  max-height: 14rem;
  overflow: auto;
  text-align: left;
}
.select_turmas {
  background: var(--sup-alt);
  border: 1px solid var(--borda);
  border-radius: var(--raio-pequeno);
  padding: .6rem .8rem;
  line-height: 2;
}
.select_turmas .form-check-input, td .form-check-input { float: none; margin: 0 .45rem 0 0; vertical-align: middle; }
.select_turmas label { cursor: pointer; vertical-align: middle; }
td.aula_geminada { text-align: left; white-space: nowrap; padding-left: 2.5rem !important; }
td:has(> details) { min-width: 15rem; text-align: center; }
td:has(> details) > details > summary { margin-inline: auto; }
td.aula_geminada > * { vertical-align: middle; }
td.aula_geminada label { margin-right: .5rem; }
.turmas_ch { background: transparent; }
table.detalhes.turmas_ch { width: 100%; margin-top: .6rem; background: var(--sup-alt); border: 1px solid var(--borda); border-radius: var(--raio-pequeno); border-collapse: separate; }
table.turmas_ch td { border: 0; padding: .35rem .5rem; vertical-align: middle; text-align: left; font-size: .9rem; }
.turmas_ch_input { max-width: 5.5rem; min-width: 3.5rem; }
.carga_horaria_igual { transform: scale(1.2); margin: 0 .4rem 0 0; }

/* Aba "Horários não disponíveis" */
.horarios_n_disp_por_dias_da_semana { font-size: .88rem; min-width: 10.5rem; white-space: nowrap; text-align: center; }
.horarios_n_disp_por_dias_da_semana hr { margin: .45rem 0; opacity: .12; }
.horarios_n_disp_por_dias_da_semana input[type="checkbox"] {
  transform: scale(1.15);
  margin: 0 .05rem 0 .4rem;
  vertical-align: -.1em;
}
.horarios_n_disp_por_dias_da_semana input[type="checkbox"]:first-of-type { margin-left: 0; }
/* V37: horários por aula (4 a 6) em colunas com o rótulo acima da caixa; efeito de destaque ao passar o mouse */
.horarios_n_disp_por_dias_da_semana { white-space: normal; transition: transform .2s ease; }
.horarios_n_disp_por_dias_da_semana:hover { transform: scale(1.2); z-index: 10; position: relative; }
.hr_info_max_hnd { margin: 4px 0; }
.checkbox-label-vertical {
  display: inline-flex; flex-direction: column; align-items: center;
  margin: .3em; cursor: pointer;
}
.checkbox-label-vertical span { order: -1; margin-bottom: .2em; font-size: .9em; }
.horarios_n_disp_por_dias_da_semana .checkbox-label-vertical input[type="checkbox"] { transform: scale(1.25); margin: 0; vertical-align: baseline; }
.link-aba { cursor: pointer; }
.opcao input[type="radio"], td.opcao input { margin: 0; }
input.n_dias_trab_por_semana, .n_max_aulas_dia { max-width: 9rem; margin-inline: auto; }
td.opcao .form-control { margin-bottom: .4rem; }
td.opcao .form-control:disabled, td.opcao .form-control[readonly] { background: var(--campo-desab); }

/* ---------- Verificação de dados ---------- */
.verificar {
  display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
  background: var(--superficie);
  padding: 1rem 1.25rem;
  border-radius: var(--raio);
  box-shadow: var(--sombra);
}
.verificar .btn, .verificar .form-control { margin: 0; }
.verificar .form-control { width: auto; min-width: 14rem; }
.gerar_configuracao { margin: 0; }
.erros {
  text-align: left;
  background: var(--superficie);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  min-height: 6rem;
  margin-top: 1.1rem;
  padding: 1rem;
  width: 100%;
  animation: erro .35s ease-out;
}
.erros:empty { display: none; }
@keyframes erro { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.erro_interno {
  margin: 0 0 .75rem;
  padding: .85rem 1rem;
  border-left: 4px solid var(--perigo);
  background: var(--perigo-claro);
  color: var(--texto-erro);
  border-radius: 0 var(--raio-pequeno) var(--raio-pequeno) 0;
  animation: erro .5s ease-out;
}
.erro_interno ul { margin: .4rem 0 0; }
.erro_interno.sucesso {
  color: var(--sucesso-texto); background: var(--sucesso-claro); border-left-color: var(--sucesso);
}
.sucesso { color: var(--sucesso-texto); }

/* ---------- Resultados (quadros de horários) ---------- */
.aba6 { background: transparent; }
.quadro_horarios_vazio {
  max-width: 760px;
  margin: 1.5rem auto;
  padding: 1.25rem 1.5rem;
  background: var(--superficie);
  border-left: 4px solid var(--marca-media);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  color: var(--texto-suave);
  text-align: left;
}
.t-horarios.row {
  display: flex; flex-wrap: wrap; gap: 1.25rem;
  margin: 0; padding: 1rem 1.5rem 0;
}
.t-horarios.row > div {
  flex: 1 1 22rem; max-width: 100%;
  background: var(--superficie);
  padding: 0;
  margin: 0;
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  overflow: hidden;
}
table.t-horarios {
  width: 100%;
  margin: 0;
  font-size: .92rem;
  border-collapse: collapse;
  background: var(--superficie);
}
table.t-horarios thead tr:first-child th {
  background: var(--marca-escura); color: #fff; font-size: 1rem; padding: .7rem; border: 0;
}
table.t-horarios thead tr:nth-child(2) th {
  background: var(--marca-clara); color: var(--titulo); font-weight: 600; font-size: .82rem;
  padding: .5rem .35rem; border: 0; border-bottom: 1px solid var(--borda);
}
table.t-horarios td { padding: .5rem .35rem; border: 0; border-bottom: 1px solid var(--linha); min-width: 0; max-width: none; }
table.t-horarios tbody tr:nth-child(even) td { background: var(--zebra); }
table.t-horarios tbody tr:hover td { background: var(--marca-clara); }
table.t-horarios tbody tr:last-child td { border-bottom: 0; }
table.t-horarios thead tr:nth-child(2) th:first-child { white-space: nowrap; }
table.t-horarios td:first-child { font-weight: 600; color: var(--titulo); background: var(--col-primeira) !important; width: 3.5rem; }
.t_cabacalho { color: #fff; }

/* ---------- Salvar ---------- */
.form_salvar {
  background: var(--superficie);
  padding: 1.5rem;
  margin: 1.25rem auto;
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  text-align: left;
}
.form_salvar > div:first-child { font-weight: 600; font-size: 1.1rem; }
.form_salvar label { font-weight: 500; margin: .75rem 0 .35rem; }
.form_salvar > .btn { margin-top: .9rem !important; }
.form_salvar > div:last-child { line-height: 1.9; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--borda); color: var(--texto-suave); font-size: .92rem; }

/* ---------- Janelas modais ---------- */
.modal-content {
  border: 0;
  border-radius: calc(var(--raio) + 4px);
  box-shadow: 0 20px 60px var(--cartao-sombra);
  overflow: hidden;
}
.modal-header { border-bottom: 0; padding: 1.25rem 1.5rem .5rem; }
.modal-title { font-weight: 700; color: var(--titulo); font-size: 1.25rem; }
.modal-body { padding: .5rem 1.5rem 1.25rem; color: var(--texto); }
.modal-footer { border-top: 0; background: var(--sup-alt); padding: .9rem 1.5rem; gap: .5rem; }
.modal-footer:empty { display: none; }
.modal-backdrop.show { opacity: .55; background: #0b2423; }

/* ---------- Formulário de feedback ---------- */
.required label::after { content: " *"; color: var(--perigo); }
.form-group.required, #formulario_feedback .form-group {
  padding: .75rem 1rem;
  border: 1px solid transparent;
  border-radius: var(--raio-pequeno);

}
.form-group > label { font-weight: 600; margin-bottom: .35rem; }
.has-error { border: 1px solid var(--perigo) !important; background: var(--perigo-claro); }
.alert { display: none; border-radius: var(--raio-pequeno); }
#formulario_feedback input[type="checkbox"], #formulario_feedback input[type="radio"] { margin-right: .4rem; transform: scale(1.1); }

/* ---------- Acessibilidade e telas pequenas ---------- */

// ---------- Tradução ----------
// Retorna o texto da chave no idioma atual (com fallback para "pt"); substitui {parametros}.
function t(chave, params, _nivel) {
  _nivel = _nivel || 0;
  const dic_idioma = DICIONARIO[IDIOMA] || {};
  let texto = dic_idioma[chave];
  if (texto === undefined || texto === "") texto = DICIONARIO.pt[chave];
  if (texto === undefined) {
    console.warn("i18n: chave inexistente no dicionário: " + chave);
    return chave;
  }
  return texto.replace(/\{([\w.]+)\}/g, function (original, nome) {
    if (params && Object.prototype.hasOwnProperty.call(params, nome)) return String(params[nome]);
    if (nome === "url_site") return URL_SITE_PROUESSE;
    if (_nivel < 3 && Object.prototype.hasOwnProperty.call(DICIONARIO.pt, nome)) return t(nome, undefined, _nivel + 1);
    return original;
  });
}

// Aplica o idioma ao HTML estático: [data-i18n] (texto), [data-i18n-html] (HTML),
// [data-i18n-attr="atributo:chave;atributo2:chave2"] (atributos), <html lang> e <title>.
function aplicar_idioma() {
  document.documentElement.lang = (IDIOMA === "en") ? "en" : "pt-br";
  const titulo_pagina = t("pagina.titulo");
  if (titulo_pagina) document.title = titulo_pagina;

  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    el.innerHTML = t(el.getAttribute("data-i18n-html"));
  });
  document.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
    el.getAttribute("data-i18n-attr").split(";").forEach(function (par) {
      const i = par.indexOf(":");
      if (i > 0) el.setAttribute(par.slice(0, i).trim(), t(par.slice(i + 1).trim()));
    });
  });
}

// O HTML estático acima já foi lido; aplicar agora (antes do registro de eventos e da 1ª renderização)
aplicar_idioma();

/* Compatibilidade jQuery + Bootstrap 5: o Bootstrap 5 escuta cliques nativos, e $(link).click() do jQuery
   não gera clique nativo em <a>. Este tratador faz as chamadas $('#abaX-tab').click() do código trocarem a aba. */
$(document).on('click', '[data-bs-toggle="tab"]', function (e) {
  e.preventDefault();
  bootstrap.Tab.getOrCreateInstance(this).show();
});

/* Tema claro/escuro. O tema inicial é definido no <head> (escolha salva ou preferência do sistema);
   aqui fica o botão da barra superior. A escolha é guardada em localStorage (se disponível). */
function aplicar_tema(tema, salvar) {
  document.documentElement.setAttribute('data-bs-theme', tema);
  $('#alternar_tema').attr('aria-pressed', tema === 'dark');
  $('meta[name="theme-color"]').attr('content', tema === 'dark' ? '#0e1616' : '#173a39');
  if (salvar) { try { localStorage.setItem('prouesse_tema', tema); } catch (e) {} }
}
aplicar_tema(document.documentElement.getAttribute('data-bs-theme') || 'light', false);
$(document).on('click', '#alternar_tema', function () {
  aplicar_tema(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark', true);
});
// Sem escolha salva, acompanha mudanças do tema do sistema
if (window.matchMedia) {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
    let salvo = null;
    try { salvo = localStorage.getItem('prouesse_tema'); } catch (err) {}
    if (!salvo) aplicar_tema(e.matches ? 'dark' : 'light', false);
  });
}

function controle_numerico(evento, min, max){
  let a = '[' + min + '-' + max + ']*';
  let b = new RegExp(a);
  if(b.exec(evento.key)[0] == "")
    evento.preventDefault();
  else {
    if(evento.target.value.length > 1)
      evento.preventDefault();
      $(evento.target).val(evento.Key);
  }
}

// Validando as turmas por disciplina para retornar erro de preenchimento turma com duas disciplinas iguais
function validando_turmas(e){
  let professor = $(e.target).parents('tr').find('.professor').html();
  let disciplina = prof_disc.professor.indexOf(professor);
  disciplina = prof_disc.disciplina[disciplina]
  let turma = $(e.target).next().html();
  let igual = 0;

  function a (obj){
    if(obj.turma == turma && obj.disciplina == disciplina){
      igual++
      return true;
    } else return false;
  }

  let filtro = turmas_prof_disc_check.filter(a);

  if(igual>1){
    let c = "";
    for(let i = 0; i < filtro.length; i++){
      c += filtro[i].professor ;
      if((filtro.length - i) > 1)
        c+= '; <br>';
      else c+= '.';
    }

    let a = '<div>' + t('modal.turma_disc_repetida.mensagem', {turma: turma, disciplina: disciplina, professores: c}) + '</div>'
    // Construir o 
    $('#modal').html(a);

    $('.modal-footer').html(b);
    $('.modal-title').html(t('modal.titulo_alerta_triste'))

  }
}

    e.preventDefault();
    selecao = $(e.target).parent().next();

    if(selecao.length > 0)
      selecao.find(classe).select();

    else if (classe == '.opcao_1'){
      $(e.target).parents('tr').find('.opcao_2').eq(0).select();
    }
    else if(classe == '.opcao_2'){
      $(e.target).parents('tr').next().find('.opcao_1').eq(0).select();
    }
  } 
})


function testesDeConsistencia(dados) {
  console.log(dados)

    let m5 = dados.m5;
    let nomeA = dados.nomeA;
    let nomeP = dados.nomeP;
    let qP = dados.qP;
    let qA = dados.qA; 
    let nTurmasP = dados.nTurmasP;
    let lista = dados.lista;
    let ch = dados.ch;
    let maxP = dados.maxP;
    let horariosND = dados.horariosND;
    let semGeminadasP = dados.semGeminadasP;
    let comGeminadasP = dados.comGeminadasP;
    let maxDiasP = dados.maxDiasP;
let test1, d, aux, aux1, aux2, j, k, k1, p, a;
let soma = [];
let arranjo = [];
let sErros_ = [];


for (p = 1; p <= qP; p++) {
  if (nTurmasP[p] == 0) {
    sErros_.push(t('consistencia.erro1', {prof: nomeP[p]}));
  }
}

for (p = 1; p <= qP; p++) {
  test1 = true;
  for (d = 0; d <= 4; d++){
    test1 = test1 && maxP[p][d] < 2;
  }
  if (comGeminadasP[p] && test1){
    sErros_.push(t('consistencia.erro2', {prof: nomeP[p]}));
  }

  if (semGeminadasP[p] && maxDiasP[p] == 1){
    sErros_.push(t('consistencia.erro3', {prof: nomeP[p]}));
  }
  
  aux1 = 0;
  for (j = 1; j <= nTurmasP[p]; j++) {
    aux1 += Number(ch[p][j]);
    if (comGeminadasP[p] && ch[p][j] == 1)
      sErros_.push(t('consistencia.erro4', {prof: nomeP[p]}));
  }
  aux2 = 0;
  for (d = 0; d <= 4; d++){
    aux2 += Number(maxP[p][d]);
  }
  if (aux1 > aux2){ // aux1 = carga horaria semanal total
    sErros_.push(t('consistencia.erro5', {prof: nomeP[p]}));
  }
  for (d = 0; d <= 4; d++){ 
    arranjo[d] = maxP[p][d];
  }
  arranjo.sort(function(a,b){return a - b});
  aux = 0;
  for (k = 0; k < maxDiasP[p]; k++){
    aux += arranjo[4-k];
  }
  if (aux1 > aux){ // aux = soma dos maxDiasP[p] maiores maxP[p][*]
    sErros_.push(t('consistencia.erro6', {prof: nomeP[p]}));
  }
}

for (a = 1; a <= qA; a++)
  soma[a] = 0;
for (p = 1; p <= qP; p++) {
  for (j = 1; j <= nTurmasP[p]; j++){
    soma[lista[p][j]] += (ch[p][j] * 1);
  }
}
for (a = 1; a <= qA; a++) {
  if (soma[a] != m5 * 5)
    sErros_.push(t('consistencia.erro7', {turma: nomeA[a]}));
}

for (d = 0; d <= 4; d++) {
  aux1 = 0;
  for (p = 1; p <= qP; p++)
    aux1 += maxP[p][d];
  if (aux1 < m5 * qA)
    sErros_.push(t('consistencia.erro8', {dia: t('dias.ord_ordinal.' + d)}));
}

for (d = 0; d <= 4; d++) {
  for (k1 = 1; k1 <= m5; k1++) {
    aux1 = qP;
    for (p = 1; p <= qP; p++) {
      if (horariosND[p][d][k1] || maxP[p][d] == 0) 
        aux1--;
    }
    if (aux1 < qA)
      sErros_.push(t('consistencia.erro9', {n: aux1, dia: t('dias.ord_a.' + d), horario: k1}));
  }
}

for (p = 1; p <= qP; p++) {
  for (d = 0; d <= 4; d++) {
    // determinando o nro aux1 de horários não disponíveis do prof.
    // p no dia d:
    aux1 = 0;
    for (k1 = 1; k1 <= m5; k1++) {
      if (horariosND[p][d][k1])
        aux1++;
    }
    if (maxP[p][d] > m5 - aux1)
      sErros_.push(t('consistencia.erro10', {prof: nomeP[p], dia: t('dias.ord_a.' + d)}));
    if ( (!semGeminadasP[p]) && maxP[p][d] > 2 * nTurmasP[p] )
      sErros_ .push(t('consistencia.erro_muitas_aulas', {prof: nomeP[p], dia: t('dias.ord_ordinal_f.' + d), n: nTurmasP[p]}));
    if (semGeminadasP[p] && maxP[p][d] > nTurmasP[p]) 
      sErros_.push(t('consistencia.erro_muitas_aulas_sem_geminada', {prof: nomeP[p], dia: t('dias.ord_ordinal_f.' + d), n: nTurmasP[p]}));
  }
}

for (p = 1; p <= qP; p++) {
  aux = 0;
  for (d = 0; d <= 4; d++) {
    if (maxP[p][d] > 0)
      aux++;
  }

  if (aux < maxDiasP[p])
    sErros_.push(t('consistencia.erro11', {prof: nomeP[p]}));
  test1 = false;
  for (j = 1; j <= nTurmasP[p]; j++) {
    if (ch[p][j] > 1)
      test1 = true;
  }
  if (test1 && semGeminadasP[p] && (aux < 2 || maxDiasP[p] < 2))
    sErros_.push(t('consistencia.erro12', {prof: nomeP[p]}));
}

for (p = 1; p <= qP; p++) {  
  aux1 = (semGeminadasP[p] ? 1 : 2);
  aux = 0;
  for (d = 0; d <= 4; d++) 
    aux += Math.min( maxP[p][d], aux1 );
  aux = Math.min( aux, maxDiasP[p]*aux1 );
  for (j = 1; j <= nTurmasP[p]; j++) {
    if (ch[p][j] > aux)
      sErros_.push(t('consistencia.erro13', {prof: nomeP[p], turma: nomeA[lista[p][j]]}));
  }
}
// fim dos testes de consistencia
return sErros_;
}

  let dia_semana;
  let dia_obj = new Object();

  let d;

  $(e).parents('tr').each((indice, elem)=>{
      for(let i = 2; i <= 6; i++){
        checado = [];
        d = '.dia_' + i;
        $(elem).find(d).each((indice2, elem2)=>{
          if($(elem2).is(':checked'))
            checado.push(true);
          else checado.push(false);
          dia_semana = $(elem2).attr('class');
        })
      dia_obj[dia_semana] = checado;
      }
  })

  horarios_n_disp_dias_semana[professor] = dia_obj;
  dados_restauracao.horarios_n_disp_dias_semana = horarios_n_disp_dias_semana;
  dados_restauracao.existe_restauracao = true;
  dados_restauracao.m5 = num_aulas_por_dia || 5;
}

function adapta_array(arr_entrada){ // Coleta os dados do con

  let nomeP = new Array();
  let nomeA =  new Array();
  nomeP = arr_entrada[1].nomeP;
  nomeA = arr_entrada[1].nomeA;
  // let m5 = 5;
  let qP;
  let qA;
  let lista_turmas = new Array();
  let nTurmasP = new Array();
  let lista = new Array();
  let ch = new Array();
  let maxP = new Array();
  let horariosND = new Array();
  let semGeminadasP = new Array();
  let comGeminadasP = new Array();
  let maxDiasP = new Array();

  qP = nomeP.length -1; //nro de profs.
  qA = nomeA.length - 1; //nro de turmas.

  function lista_de_turmas(arr){
    let a;
    let b = 0;
    $('.input_turmas input').each((valor, elem) =>{
      a = $(elem).val();
      if(a != ""){
        lista_de_turmas[b + 1] = a;
        b++;
        arr.push(a);
      }
     })
  }
  lista_de_turmas(lista_turmas);

  // Preenchendo array
  for(let i = 0; i <  (arr_entrada.length - 1); i++){
    nTurmasP [i+1] = arr_entrada[i+1].nTurmasP;
    
    lista [i+1] = new Array();
    ch[i+1] = new Array();
    lista [i+1][0] = null;
    ch [i+1][0] = null;

    for(let p = 0; p < arr_entrada[i+1].lista.length; p++){
      lista[i+1][p+1] = lista_turmas.indexOf(arr_entrada[i+1].lista[p]) + 1;
      ch[i+1][p+1] = arr_entrada[i+1].ch[p];
    }
    
    maxP[i+1] = new Array();
    for(let p = 0; p < arr_entrada[i+1].maxP.length; p++){
      maxP[i+1][p] = arr_entrada[i+1].maxP[p];
    }

    horariosND[i+1] = new Array();
    let controle = 0; // refente ao dia da semana

    for(const prop in arr_entrada[i+1].horariosND){
      horariosND[i+1][controle] = new Array();

      for(let n = 0; n < arr_entrada[i+1].horariosND[prop].length; n++){
        horariosND[i+1][controle][n + 1] = arr_entrada[i+1].horariosND[prop][n];
      }
      controle++;
    }

    semGeminadasP [i+1] = arr_entrada[i+1].semGeminadasP;
    comGeminadasP [i+1] = arr_entrada[i+1].comGeminadasP;
    maxDiasP[i+1] = arr_entrada[i+1].maxDiasP;
  }

  obj_saida = {
    dados_restauracao: dados_restauracao,
    nomeA: nomeA,
    nomeP: nomeP,
    qP: qP,
    qA: qA, 
    nTurmasP: nTurmasP,
    lista: lista,
    ch: ch,
    maxP: maxP,
    horariosND: horariosND, 
    semGeminadasP: semGeminadasP, 
    comGeminadasP: comGeminadasP,
    maxDiasP: maxDiasP,
    tabelaP: '',
    tabelaA: '',
    maxHorariosND: '',
    m5: arr_entrada[1].m5
  }
  return obj_saida;
  //gerando_arq_conf(obj_saida)
}


function gerando_arq_conf(arr_para_json, id_nome){
  data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(arr_para_json));
  let a = document.createElement("a");
  document.body.appendChild(a);
  a.style = "display: none";
  a.href = 'data:' + data ;
  let b = $(id_nome).val();
  if(b == "")
    b = t('arquivo.nome_padrao');
  a.download = b + ".json";
  a.click();
}

   QUADROS DE HORÁRIOS: exibição na tela (aba Resultados) e impressão
   - Cada quadro é uma <table> montada por quadro_html(); todo texto vindo do usuário passa por esc().
   - Tela: os quadros ficam em linhas ("row t-horarios") de 'lado_lado' quadros.
   - Impressão: documento próprio (documento_impressao()) enviado a um <iframe> oculto, sem pop-up
     (não é barrado por bloqueadores). O layout é uma grade CSS com @page, quebras de página por seção
     e quadros que nunca são cortados entre páginas.
   ===================================================================== */
function esc(valor){
  return String(valor).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const DIAS_QUADRO = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];

// HTML de UM quadro. linhas[j][h] = texto do horário j (0..4) no dia h (0..4); abreviar = nomes curtos dos dias
function quadro_html(titulo, linhas, abreviar){
  let q = '<table class="t-horarios text-center align-middle"><thead class="t_cabacalho">';
  q += '<tr><th colspan="6">' + esc(titulo) + '</th></tr><tr><th>' + esc(t('quadro.horario_dia')).replace('\\', '\\<wbr>') + '</th>';
  DIAS_QUADRO.forEach(d => { q += '<th>' + t((abreviar ? 'dias_abrev.' : 'dias.') + d) + '</th>'; });
  q += '</tr></thead><tbody>';
  linhas.forEach((celulas, j) => {
    q += '<tr><td>' + t('comum.horario_' + (j + 1)) + '</td>';
    celulas.forEach(c => { q += '<td>' + esc(c) + '</td>'; });
    q += '</tr>';
  });
  return q + '</tbody></table>';
}

// Número de aulas por dia dos quadros (4, 5 ou 6), vindo do arquivo importado ou da aba "Dados iniciais"
function aulas_por_dia_quadro(){
  return dados_Prouesse.dados_restauracao.m5 || dados_Prouesse.m5 || num_aulas_por_dia || 5;
}

// Um quadro por professor: células = turma onde ele leciona ('-' = livre)
function quadros_professores(abreviar){
  const n = aulas_por_dia_quadro();
  const tabelaP = dados_Prouesse.tabelaP;
  const lista_turmas = dados_Prouesse.dados_restauracao.turmas_declaradas;
  const lista_prof = dados_Prouesse.dados_restauracao.prof_disciplinas;
  const quadros = [];
  for(let i = 1; i < tabelaP.length; i++){
    const linhas = [];
    for(let j = 1; j <= n; j++){
      const celulas = [];
      for(let h = 0; h < 5; h++){
        const turma = tabelaP[i][h][j];
        celulas.push(turma ? (lista_turmas[turma - 1] !== undefined ? lista_turmas[turma - 1] : '-') : '-');
      }
      linhas.push(celulas);
    }
    quadros.push(quadro_html(t('quadro.professor', {professor: lista_prof[i - 1].professor}), linhas, abreviar));
  }
  return quadros;
}

// Um quadro por turma: células = disciplina ou professor ('-' = sem aula). prop_obj: 'disciplina' | 'professor'
function quadros_turmas(prop_obj, abreviar){
  const tabela = dados_Prouesse.tabelaA;
  const lista_turmas = dados_Prouesse.dados_restauracao.turmas_declaradas;
  const prof_disciplinas = dados_Prouesse.dados_restauracao.prof_disciplinas;
  const n = aulas_por_dia_quadro();
  const quadros = [];
  for(let i = 1; i < tabela.length; i++){
    const linhas = [];
    for(let j = 1; j <= n; j++){
      const celulas = [];
      for(let h = 0; h < 5; h++){
        const a = tabela[i][h][j] - 1;
        celulas.push(prof_disciplinas[a] !== undefined ? prof_disciplinas[a][prop_obj] : '-');
      }
      linhas.push(celulas);
    }
    quadros.push(quadro_html(t('quadro.turma', {turma: lista_turmas[i - 1]}), linhas, abreviar));
  }
  return quadros;
}

// imprimir=false: linhas da tela; imprimir=true: cada quadro em um <div class="quadro"> (a grade fica por conta do CSS)
function montar_quadros(quadros, lado_lado, imprimir){
  lado_lado = Number(lado_lado) || 2;
  if(imprimir)
    return quadros.map(q => '<div class="quadro">' + q + '</div>').join('');
  let saida = '';
  quadros.forEach((q, i) => {
    if(i % lado_lado == 0) saida += '<div class="row t-horarios">';
    saida += '<div>' + q + '</div>';
    if((i + 1) % lado_lado == 0 || i == quadros.length - 1) saida += '</div>';   // a última linha também é fechada
  });
  return saida;
}

function construtor_quadro_de_horarios_prof(lado_lado, imprimir){
  return montar_quadros(quadros_professores(imprimir && lado_lado >= 3), lado_lado, imprimir);
}

function construtor_quadro_de_horarios_turma_disc(prop_obj, lado_lado, imprimir){
  return montar_quadros(quadros_turmas(prop_obj, imprimir && lado_lado >= 3), lado_lado, imprimir);
}

  ).join('');

// Documento HTML completo da impressão (independente da página: tema claro, A4, sem depender de CDN)
function documento_impressao(){
  const lado = Number($('#lado-lado').val()) || 2;
  const orientacao = ($('#orientacao').val() === 'landscape') ? 'landscape' : 'portrait';
  const fonte = {1: 10.5, 2: 9, 3: 7, 4: 5.4}[lado] || 9;   // pt; diminui conforme cabem mais quadros por linha
  const margem_celula = {1: '1.4mm 1mm', 2: '1.2mm 0.8mm', 3: '1mm 0.5mm', 4: '0.8mm 0.3mm'}[lado] || '1.2mm 0.8mm';
  const idioma = (IDIOMA === 'en') ? 'en' : 'pt-br';
  const data = new Date().toLocaleDateString(idioma === 'en' ? 'en-US' : 'pt-BR');
  const css = [
    '@page { size: A4 ' + orientacao + '; margin: 12mm 9mm; }',
    '* { box-sizing: border-box; }',
    'body { margin: 0; color: #111; font-family: "Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif; font-size: ' + fonte + 'pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
    'header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4mm; font-size: 8pt; color: #555; }',
    'header h1 { margin: 0; font-size: 12pt; color: #111; }',
    '.secao + .secao { break-before: page; }',
    'h2 { margin: 0 0 3mm; padding-bottom: 1mm; font-size: 11pt; border-bottom: 2px solid #153f3e; break-after: avoid; }',
    '.grade { display: grid; grid-template-columns: repeat(' + lado + ', minmax(0, 1fr)); gap: 4mm 3mm; align-items: start; }',
    '.quadro { break-inside: avoid; }',
    'table.t-horarios { width: 100%; table-layout: fixed; border-collapse: collapse; text-align: center; }',
    '.t-horarios th, .t-horarios td { border: 1px solid #555; padding: ' + margem_celula + '; overflow-wrap: break-word; line-height: 1.2; }',
    '.t-horarios thead tr:first-child th { background: #dfe8e7; font-size: 1.1em; text-align: center; }',
    '.t-horarios thead tr:nth-child(2) th { background: #f1f5f5; font-size: .9em; }',
    '.t-horarios thead tr:nth-child(2) th:first-child, .t-horarios tbody td:first-child { width: ' + (lado >= 4 ? 11 : 14) + '%; }',
    '.t-horarios tbody td:first-child {  font-weight: 600; background: #f6f8f8; }',
    '.t-horarios tbody tr:nth-child(even) td:not(:first-child) { background: #fafcfc; }'
  ].join('\n');
  return '<!DOCTYPE html><html lang="' + idioma + '"><head><meta charset="utf-8"><title>' + esc(t('imprimir.titulo_janela')) + '</title><style>' + css + '</style></head><body>' +
    '<header><h1>' + esc(t('imprimir.titulo_janela')) + '</h1><span>' + data + '</span></header>' + construtor_q_horarios_export() + '</body></html>';
}

// Imprime em um <iframe> oculto: sem pop-up, espera o documento carregar antes de chamar print() e
// usa o título da impressão como nome sugerido do PDF.
function imprimir_quadros(){
  $('#frame_impressao').remove();
  const frame = document.createElement('iframe');
  frame.id = 'frame_impressao';
  frame.setAttribute('aria-hidden', 'true');
  frame.tabIndex = -1;
  frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  const titulo_original = document.title;
  frame.onload = function(){
    const janela = frame.contentWindow;
    const restaurar = function(){ document.title = titulo_original; };
    janela.addEventListener('afterprint', restaurar);
    document.title = t('imprimir.titulo_janela');
    try { janela.focus(); janela.print(); } catch(e) { restaurar(); }
  };
  frame.srcdoc = documento_impressao();
  document.body.appendChild(frame);
}
